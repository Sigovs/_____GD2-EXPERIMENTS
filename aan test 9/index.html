<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GD2 — the mountain</title>
<meta name="description" content="The deeper you go, the more you know.">
<!-- the intro (src/intro.js) holds the scene until its cue; the class is set here, only where scripts run, so a page without them is never blank -->
<script>document.documentElement.classList.add('is-intro');</script>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;600;800&display=swap">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Crect width=%2732%27 height=%2732%27 rx=%276%27 fill=%27%2397C82C%27/%3E%3Cpath d=%27M6 24 L16 8 L26 24 Z%27 fill=%27%2305080f%27/%3E%3C/svg%3E">
<link rel="stylesheet" href="src/nav.css?v=2026-09-18w">
<link rel="stylesheet" href="src/hero.css?v=2026-09-19s">
<link rel="stylesheet" href="src/route.css">
</head>
<body>

	<!-- ONE SCENE. The film is the scene; the scroll is its transport. The film is a FRAME SEQUENCE on a canvas
	     (src/film-frames.js): a seek is a drawImage, no keyframe decode, no iOS seek jitter, and the two frames
	     around the scroll position are crossfaded so 24 fps reads as smooth. The <video> transport is parked
	     (src/hero-scrub.js) — swap the two script tags below to go back. -->
	<div class="stage">
		<!-- ACT I — the mountain: the film and the tent's light in one wrapper, so the hand-over (src/descent.js)
		     blurs and dissolves them together -->
		<div id="act-hero" class="stage__act">
			<!-- MULTIPLANE (src/layers.js): far → near. The film, the cloud plates, the plateau with the tent (keyed
			     from green; a frame sequence with alpha once its video lands), then the tent's light -->
			<canvas id="hero-film" class="stage__video layer" aria-hidden="true"></canvas>
			<!-- HERO 'still': the mountain as one frame (new hero finale) — no camera move at all; the clouds and the plateau carry the motion -->
			<img id="hero-still" class="layer layer--still" src="assets/layers/mountain-still.webp" alt="" decoding="async" hidden>
			<!-- HERO 'mountain3d': the 3-D mountain of test 7 (with its route) as the far plane, embedded; the host posts the scroll and the cursor -->
			<iframe id="hero-3d" class="layer layer--3d" title="" aria-hidden="true" tabindex="-1" hidden></iframe>
			<canvas id="cloud-canvas" class="stage__clouds layer" aria-hidden="true"></canvas>
			<!-- the near plane: the plateau FILM with alpha (plato2: the camera pushes in), scrubbed with the mountain, and the
			     tent's light drawn over it (src/tent-glow.js) — one element, so layers.js moves them together -->
			<div id="plane-plateau" class="layer">
				<!-- the light sits BEHIND the plate (Alex, 19 Sep): the tent and the rocks cover it, the glow goes into the air behind -->
				<canvas id="tent-glow" class="stage__glow" aria-hidden="true"></canvas>
				<canvas id="tent-dodge" class="stage__glow stage__glow--dodge" aria-hidden="true"></canvas>
				<canvas id="plateau" class="layer layer--plateau" aria-hidden="true"></canvas>
				<!-- a little of the light OVER the plate: stretched sideways (tent-glow.js → cfg.top) -->
				<canvas id="tent-glow-top" class="stage__glow" aria-hidden="true"></canvas>
			</div>
		</div>
		<!-- ACT II — the water: starts under the surface (the tent's light warped above), comes up over the mountain
		     for a moment, then the scroll scrubs the descent. Same frame transport. -->
		<canvas id="water-film" class="stage__video stage__act" aria-hidden="true"></canvas>
		<!-- the water answers the cursor with rings: a wave field refracting the film (src/water-waves.js); hidden until it stirs -->
		<canvas id="water-waves" class="stage__glow" aria-hidden="true" style="visibility:hidden"></canvas>
		<!-- what moves in the water while the film is a still: caustics, the suspension, bubbles (src/water-life.js) -->
		<canvas id="water-life" class="stage__glow" aria-hidden="true"></canvas>
		<!-- the descent route over the film — an instrument, rotoscoped to the film's frames (src/route-layer.js) -->
		<canvas id="route-canvas" class="stage__route" aria-hidden="true"></canvas>
		<!-- the cloud canvas now lives inside #act-hero, between the film and the plateau -->
		<!-- the GRADE: one colour over every plane with a blend mode, plus a filter on the whole stage — to pull the mountain, the
		     clouds and the plateau into one palette (Alex, 19 Sep). Dials in the editor (G); values in tent-glow.js → cfg.grade -->
		<div id="grade" class="stage__grade" aria-hidden="true"></div>
		<!-- the finishing layers (src/fx.js, dials in the editor): a dithered radial in a colour, and film grain -->
		<canvas id="fx-radial" class="stage__fx" aria-hidden="true"></canvas>
		<canvas id="fx-grain" class="stage__fx" aria-hidden="true"></canvas>
		<canvas id="vignette-canvas" class="stage__vignette" aria-hidden="true"></canvas>
	</div>

	<!-- the route's callouts (route.css); the leaders are drawn in here by route-layer.js -->
	<div id="route-labels" aria-hidden="true"></div>

	<!-- the navigation (src/nav.css, src/nav.js): the header and the full-screen panel it opens.
	     The previous inline link row with the letter-swap hover (src/nav-letter-swap.js) is cut, not deleted:
	     restore the <ul> here and its script at the foot to bring it back. -->
	<header class="nav">
		<a class="nav__brand" href="#main" aria-label="GD2"><img src="assets/logo.png" srcset="assets/logo.png 1x, assets/logo@2x.png 2x" alt="GD2"></a>
		<button class="nav__toggle" type="button" aria-label="Menu" aria-expanded="false" aria-controls="nav-panel"><span></span><span></span><span></span></button>
	</header>
	<nav class="nav__panel" id="nav-panel" aria-label="Primary" aria-hidden="true">
		<div class="nav__inner">
			<!-- the panel head (the name and the tagline) is cut (Alex, 18 Sep: "это из меню убери") -->
			<div class="nav__body">
				<ul class="nav__links">
					<li data-reveal="link" data-i="0"><a class="nav__link" href="#main">Products &amp; Services</a></li>
					<li data-reveal="link" data-i="1"><a class="nav__link" href="#main">Grow your Business</a></li>
					<li data-reveal="link" data-i="2"><a class="nav__link" href="#main">Compliance</a></li>
					<li data-reveal="link" data-i="3"><a class="nav__link" href="#main">Contact</a></li>
				</ul>
				<div class="nav__images">
					<div class="nav__image" data-reveal="image" data-i="0"><img src="previews/hero-gora-poster.jpg" alt="" loading="lazy"></div>
					<div class="nav__image" data-reveal="image" data-i="1"><img src="previews/camp.jpg" alt="" loading="lazy"></div>
				</div>
			</div>
			<div class="nav__foot"><span data-reveal="head" data-i="2">GD2</span></div>
		</div>
	</nav>

	<main id="main" class="hero">
		<!-- the last word rotates (text-rise.js → rotateWord): the words in data-words are PLACEHOLDERS — replace with the client's -->
		<h1 class="hero__title"><span class="hero__line">The deeper</span><br><span class="hero__line">you go,</span><br><span class="hero__line">the more you <span class="hero__rotate" data-words="know.|see.|learn.|find.">know.</span></span></h1>
		<!-- the calls: two, no more (Alex, 18 Sep). Links are PLACEHOLDERS -->
		<div class="hero__cta">
			<a class="cta cta--primary" href="#main">Explore services</a>
			<a class="cta cta--ghost" href="#main">Talk to us</a>
		</div>
	</main>

	<!-- the scroll length: how much travel the films get (progress.js measures the scene by this track) -->
	<div class="spacer" aria-hidden="true"></div>


	<script type="importmap">
	{
		"imports": {
			"three": "https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js",
			"three/addons/": "https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/"
		}
	}
	</script>
	<!-- <script type="module" src="src/hero-scrub.js"></script>  the <video> transport, parked -->
	<script type="module">
		import { createFilmFrames } from './src/film-frames.js?v=2026-09-19m';
		import { createTentGlow, TENT_GLOW } from './src/tent-glow.js?v=2026-09-19s';
		import { applyGrain, applyRadial } from './src/fx.js?v=2026-09-19s';
		applyGrain(TENT_GLOW.grain); applyRadial(TENT_GLOW.radial);
		/* THE MOUNTAIN (Alex, 19 Sep: "оставь плато на любом тесте, я просто проверяю гору"): the plateau plate is ALWAYS on;
		   this only picks the far plane's film. 'pullback' = the pull-back film (assets/frames); 'gora6' = the "6 sec video". */
		const HERO = 'pullback';   // 'mountain3d' = the 3-D mountain of test 7 with its route (iframe, embed mode) · 'still' = one frame · 'pullback' | 'gora6' | 'gora5' = films
		const HERO_DIRS = { pullback: 'assets/frames', gora6: 'assets/frames/gora6', gora5: 'assets/frames/gora5' };
		const heroDir = (w) => `${HERO_DIRS[HERO]}/${w > 1700 ? 1920 : w > 1000 ? 1600 : w > 520 ? 960 : 640}`;
		import { createDescent, ACT } from './src/descent.js?v=2026-09-19n';
		// the two films: the hero scrubs the first part of the page, the water the rest — they overlap for the hand-over.
		// Neither listens to the scroll itself: descent.js drives both from one progress.
		let film;
		if (HERO === 'mountain3d') {
			const fr = document.getElementById('hero-3d'); fr.hidden = false; document.getElementById('hero-still').remove(); document.getElementById('hero-film').remove();
			fr.src = '../aan%20test%207/?embed=1';
			const post = (m) => { try { fr.contentWindow?.postMessage({ gd2: m }, '*'); } catch {} };
			window.addEventListener('pointermove', (e) => post({ mx: (e.clientX / innerWidth) * 2 - 1, my: -(e.clientY / innerHeight) * 2 + 1 }), { passive: true });
			document.body.classList.add('is-ready'); document.body.dispatchEvent(new Event('ready'));
			const R = ACT.heroEnd * ACT.heroFilmEnd;
			let hp = 0;
			film = { setProgress(P) { hp = Math.min(1, Math.max(0, P / R)); post({ p: hp }); }, get frame() { return hp * 240; }, get progress() { return hp; }, cfg: { range: [0, R] } };
		} else if (HERO === 'still') {
			const still = document.getElementById('hero-still'); still.hidden = false; document.getElementById('hero-film').remove();
			document.body.classList.add('is-ready'); document.body.dispatchEvent(new Event('ready'));
			film = { setProgress() {}, get frame() { return 240; }, get progress() { return 1; }, cfg: { range: [0, 1] } };   // the far plane has no frames: the light and the hand-over read a finished film
		} else {
			film = createFilmFrames({ canvas: document.getElementById('hero-film'), poster: HERO === 'pullback' ? 'previews/hero-poster.webp' : undefined, cfg: { range: [0, ACT.heroEnd * ACT.heroFilmEnd], scroll: false, fitParent: true, dir: heroDir, crossfade: false } });   // fitParent: the act overscans the viewport; crossfade off: two blended frames soften the fine snow while scrubbing
		}
		// the plateau plate: keyed frames with alpha, the same scrub as the mountain (src/layers.js moves the plane)
		const plateauFilm = createFilmFrames({ canvas: document.getElementById('plateau'), cfg: { range: [0, ACT.heroEnd * ACT.heroFilmEnd], scroll: false, alpha: true, fitParent: true, dir: (w) => (w > 1700 ? 'assets/frames/plateau/1920' : w > 1000 ? 'assets/frames/plateau/1600' : w > 520 ? 'assets/frames/plateau/960' : 'assets/frames/plateau/640') }, loadAfter: 900 });
		window.__plateau = plateauFilm;
		const heroFilms = { setProgress(p) { film.setProgress(p); plateauFilm?.setProgress(p); }, get frame() { return film.frame; }, get progress() { return film.progress; }, cfg: film.cfg };
		// the tent's light: over the plate's tent (multiplane) or the film's own tent (single6 — rotoscoped from its frames)
		const GLOW_SINGLE6 = { ...TENT_GLOW, film: null, intensity: 0.6, top: { ...TENT_GLOW.top, intensity: 0.35 }, fadeIn: [152, 172], fadeOut: null,
			track: [[150, 0.99, 0.995, 0.02], [156, 0.934, 0.963, 0.16], [162, 0.868, 0.944, 0.22], [168, 0.816, 0.918, 0.22], [174, 0.779, 0.894, 0.23], [180, 0.745, 0.867, 0.21], [186, 0.719, 0.844, 0.20], [192, 0.697, 0.827, 0.19], [198, 0.68, 0.811, 0.23], [204, 0.666, 0.797, 0.24], [210, 0.658, 0.786, 0.23], [216, 0.65, 0.777, 0.23], [222, 0.643, 0.768, 0.225], [228, 0.638, 0.763, 0.22], [234, 0.634, 0.757, 0.22], [240, 0.631, 0.752, 0.22]] };
		const water = createFilmFrames({ canvas: document.getElementById('water-film'), cfg: { range: [ACT.heroEnd * ACT.waterStart, 1], scroll: false, dir: (w) => (w > 1000 ? 'assets/frames/water/1600' : w > 520 ? 'assets/frames/water/960' : 'assets/frames/water/640') }, loadAfter: 2500 });
		window.__water = water;
		window.__glow = createTentGlow({ canvas: document.getElementById('tent-glow'), dodgeCanvas: document.getElementById('tent-dodge'), topCanvas: document.getElementById('tent-glow-top'), film: plateauFilm || film, cfg: plateauFilm ? TENT_GLOW : GLOW_SINGLE6 });
		// the planes: the film, the clouds, the plateau — each on its own move (src/layers.js)
		import { createLayers } from './src/layers.js?v=2026-09-19n';
		window.__layers = createLayers({ mountain: HERO === 'mountain3d' ? null /* the 3-D scene has its own parallax */ : document.getElementById(HERO === 'still' ? 'hero-still' : 'hero-film'), clouds: document.getElementById('cloud-canvas'), plateau: plateauFilm ? document.getElementById('plane-plateau') : null, heroEnd: ACT.heroEnd });   // single: the plane holds only the light, it does not move
		// the hand-over between the acts drives both films (and the clouds, once they are up) from one progress
		import { createWaterLife } from './src/water-life.js?v=2026-09-18v';
		const life = createWaterLife({ canvas: document.getElementById('water-life'), waterCanvas: document.getElementById('water-film') });
		window.__life = life;
		// the water answers the cursor: rings (src/water-waves.js, WebGL2); where float targets are missing, the soft
		// SVG lens of src/water-ripple.js stands in
		import { createWaterWaves } from './src/water-waves.js?v=2026-09-18y';
		// import { createWaterRipple } from './src/water-ripple.js?v=2026-09-18v';   // parked with the rings
		const waves = createWaterWaves({ canvas: document.getElementById('water-waves'), film: water });
		// the cursor's ripple is OFF (Alex, 18 Sep): no rings (WATER_WAVES.rings) and no SVG lens fallback either
		const ripple = { setPresence() {} };   // was: waves.enabled ? … : createWaterRipple({ target: document.getElementById('water-film') })
		window.__waves = waves;
		window.__ripple = ripple;
		// photographs floating up through the water (src/drift-cards.js)
		import { createDriftCards } from './src/drift-cards.js?v=2026-09-18x';
		window.__drift = createDriftCards();
		window.__descent = createDescent({ heroWrap: document.getElementById('act-hero'), waterCanvas: document.getElementById('water-film'), cloudCanvas: null /* layers.js owns the clouds' opacity now */, heroFilm: heroFilms, waterFilm: water, clouds: null, onWater: (w, P) => { life.setPresence(w, P); ripple.setPresence(w); waves.setPresence(w, P); } });
		// what was tuned in the editor is kept in this browser and applied here, so the page itself shows it
		try { const saved = JSON.parse(localStorage.getItem('gd2.tent-glow.t9') || 'null'); if (saved && !Array.isArray(saved)) { const { applySaved } = await import('./src/glow-editor.js?v=2026-09-19s'); applySaved(window.__glow.cfg, saved); if (saved.palette) window.__glow.setPalette(saved.palette); } } catch {}
		// the shape editor for the glow: ?edit=glow in the URL, or the G key (src/glow-editor.js)
		const openEditor = async () => { const { openGlowEditor } = await import('./src/glow-editor.js?v=2026-09-19s'); window.__glowEditor = openGlowEditor({ glow: window.__glow, film }); };
		if (new URLSearchParams(location.search).get('edit') === 'glow') openEditor();
		addEventListener('keydown', (e) => { if ((e.key === 'g' || e.key === 'G') && !window.__glowEditor && !e.metaKey && !e.ctrlKey) openEditor(); });
	</script>
	<script type="module">
		// the vignette, dithered on a canvas — a CSS gradient banded (src/vignette.js)
		import { createVignette } from './src/vignette.js?v=2026-09-19h';
		createVignette({ canvas: document.getElementById('vignette-canvas') });
	</script>
	<script type="module">
		// one module, in order: the route over the film, the cloud plates over the route, then the intro
		// that drives both. The clouds may fail (no WebGL): the intro still runs, without them.
		import { createRouteLayer } from './src/route-layer.js';
		import { runIntro } from './src/intro.js';
		import * as THREE from 'three';
		import { createCloudLayer } from './src/cloud-layer.js?v=2026-09-18e';   // the plate rig from the 3-D build — the clouds Alex approved
		import { createCloudStack } from './src/cloud-stack.js?v=2026-09-18e';   // procedural fbm layers (parked — "не те облака")
		const CLOUDS = 'plates';   // 'plates' (the rig's white breathing clouds — Alex: "это те облака") | 'stack' (procedural, parked)

		// the route is OFF for now (Alex, 18 Sep: "уберём path вообще на данном этапе" — smooth scrolling first); the
		// layer stays in the tree, one line brings it back
		window.__route = null; // the route layer was rotoscoped to the <video>; if it comes back it reads window.__film.frame
		document.getElementById('route-canvas')?.remove();

		const cloudsUp = (async () => {
			const loader = new THREE.TextureLoader();
			const load = (f) => new Promise((res, rej) => loader.load(f, (t) => { t.wrapS = t.wrapT = THREE.RepeatWrapping; res(t); }, undefined, rej));
			const [noise, perlin, cloudNoise] = await Promise.all([load('assets/textures/noise.webp'), load('assets/textures/perlinNoise.webp'), load('assets/textures/cloud-noise.png')]);
			const clouds = CLOUDS === 'stack'
				? createCloudStack({ canvas: document.getElementById('cloud-canvas'), noise: cloudNoise })
				: await createCloudLayer({ canvas: document.getElementById('cloud-canvas'), textures: { noise, perlin }, hold: null });   // no hold: no statement on the page, and its rect was a straight edge
			const progress = () => { const max = document.documentElement.scrollHeight - window.innerHeight; return max > 0 ? window.scrollY / max : 0; };
			clouds.setProgress(0);   // from here on descent.js drives it (the hero's own progress, not the page's)
			window.__clouds = clouds;
			return clouds;
		})().catch((e) => { console.warn('cloud layer off:', e); return null; });

		// the intro opens inside the cloud, so it waits for the plates — but not past 2.5 s on a slow line
		const clouds = await Promise.race([cloudsUp, new Promise((r) => setTimeout(() => r(null), 2500))]);
		window.__descent?.setClouds(clouds);   // the hand-over (src/descent.js) drives the clouds from here on
		runIntro({ route: window.__route, clouds });
	</script>
	<script type="module">import { initNav } from './src/nav.js'; window.__nav = initNav();</script>
	<script type="module">
		// the captions: text blocks that arrive with the scroll, over the mountain and under the water (src/captions.js)
		import { createCaptions } from './src/captions.js?v=2026-09-18w';
		window.__captions = createCaptions();
	</script>
</body>
</html>
