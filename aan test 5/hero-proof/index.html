<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>GD2 — H1/H2 hero proof</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;800&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
  :root{ --cyan:#00ECFF; --orange:#FF9300; --ink:#EAF0FF;
    --disp:"Inter Tight",system-ui,sans-serif; --mono:"IBM Plex Mono",ui-monospace,monospace; }
  *{box-sizing:border-box} html,body{margin:0;background:#05070F;color:var(--ink)}
  #stage{position:fixed;inset:0;overflow:hidden;background:#05070F}
  canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
  #spacer{height:700vh}
  .ui{position:absolute;inset:0;pointer-events:none;font-family:var(--disp)}

  /* ---- type: lives in the negative space, never on the peak ---- */
  .claim{position:absolute;left:6.2vw;top:11vh;max-width:min(38vw,500px)}
  .mark{display:flex;align-items:center;gap:11px;font-weight:800;font-size:18px;letter-spacing:-.04em}
  .mark i{color:var(--cyan);font-style:normal}
  .mark s{display:block;width:30px;height:2px;background:var(--orange);text-decoration:none}
  .claim h1{margin:22px 0 0;font-size:clamp(26px,3.35vw,47px);line-height:1.02;letter-spacing:-.045em;
    font-weight:600;text-wrap:balance;text-shadow:0 2px 40px rgba(5,7,15,.75)}
  .claim h1 em{font-style:normal;color:#9FB2D8}
  .claim p{margin:20px 0 0;max-width:34ch;font-size:15px;line-height:1.6;color:#A9B7D6;
    text-shadow:0 1px 24px rgba(5,7,15,.8)}

  /* ---- H2 measurement language: HTML marks, shader draws the contours ---- */
  .hud{position:absolute;inset:0;font-family:var(--mono);font-size:10.5px;letter-spacing:.1em;
    text-transform:uppercase;color:rgba(190,214,255,.62)}
  .hud .l{position:absolute;display:flex;align-items:center;gap:8px;white-space:nowrap}
  .hud .l::before{content:"";width:26px;height:1px;background:rgba(214,228,255,.42)}
  .hud .v{color:rgba(236,244,255,.92)}
  .axis{position:absolute;right:7vw;top:18vh;bottom:18vh;width:1px;background:linear-gradient(180deg,
    rgba(214,228,255,0),rgba(214,228,255,.30) 18%,rgba(214,228,255,.30) 82%,rgba(214,228,255,0))}
  .axis span{position:absolute;right:0;width:9px;height:1px;background:rgba(214,228,255,.5)}
  .axis b{position:absolute;right:16px;font-weight:400;color:rgba(190,214,255,.55);
    font-size:10px;letter-spacing:.1em;transform:translateY(-50%)}
  .rdt{position:absolute;left:6.2vw;bottom:7vh;display:flex;gap:26px;font-family:var(--mono);
    font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:rgba(190,214,255,.55)}
  .rdt i{font-style:normal;color:rgba(236,244,255,.9);font-variant-numeric:tabular-nums}

  .cue{position:absolute;left:50%;bottom:26px;transform:translateX(-50%);font-family:var(--mono);
    font-size:10px;letter-spacing:.22em;text-transform:uppercase;color:rgba(190,214,255,.4)}
  .fade{transition:opacity .35s linear}
  @media (prefers-reduced-motion:reduce){.fade{transition:none}}
</style></head>
<body>
<div id="stage">
  <canvas id="c"></canvas>
  <div class="ui">
    <div class="claim fade" id="claim">
      <div class="mark">GD<i>2</i><s></s></div>
      <h1>The file already exists.<br><em>You just haven&rsquo;t opened it.</em></h1>
      <p>From a single page view &mdash; 300+ data points on an anonymous visitor.</p>
    </div>
    <div class="hud fade" id="hud">
      <div class="axis" id="axis"></div>
      <div class="l" id="l1" style="left:52vw;top:30vh">Ridge <span class="v" id="l1v">2 840 m</span></div>
      <div class="l" id="l2" style="left:60vw;top:44vh">Deck <span class="v" id="l2v">1 900 m</span></div>
      <div class="rdt" id="rdt"><span>Alt <i id="ralt">3 400</i> m</span><span>Descent <i id="rdes">000</i></span><span>Trace <i id="rtr">01 / 09</i></span></div>
    </div>
    <div class="cue fade" id="cue">Scroll</div>
  </div>
</div>
<div id="spacer"></div>

<script id="fs" type="x-shader/x-fragment">#version 300 es
precision highp float;
out vec4 O;
uniform vec2 R; uniform float T; uniform float OV; uniform float CQ;

const float CB = -26.0;      /* deck bottom  ==  the underside of the water surface */
const float CT =  46.0;      /* deck top */
const vec3  LC = vec3(0.88, 0.93, 1.05);

float h31(vec3 p){ p = fract(p*0.3183099 + vec3(0.11,0.27,0.43)); p *= 17.0;
  return fract(p.x*p.y*p.z*(p.x+p.y+p.z)); }
float vn(vec3 x){ vec3 i=floor(x), f=fract(x); f=f*f*(3.0-2.0*f);
  return mix(mix(mix(h31(i),h31(i+vec3(1,0,0)),f.x), mix(h31(i+vec3(0,1,0)),h31(i+vec3(1,1,0)),f.x), f.y),
             mix(mix(h31(i+vec3(0,0,1)),h31(i+vec3(1,0,1)),f.x), mix(h31(i+vec3(0,1,1)),h31(i+vec3(1,1,1)),f.x), f.y), f.z); }
float fbm(vec3 p, int oct){ float a=0.5,s=0.0; for(int i=0;i<7;i++){ if(i>=oct) break; s+=a*vn(p); p=p*2.03+vec3(1.7,0.0,-1.3); a*=0.5; } return s; }
float ridge(vec2 p){ float a=0.5,s=0.0; vec3 q=vec3(p*0.0019,0.0);
  for(int i=0;i<4;i++){ float n=vn(q); n=1.0-abs(n*2.0-1.0); s+=a*n*n; q=q*2.06+vec3(3.1,0.0,1.9); a*=0.5; } return s; }

/* One height field describes both halves of the journey:
   above the deck it is the hero peak; below the deck it is the chasm the descent runs down.
   The mountain flown over and the wall descended beside are the same terrain. */
float terrainH(vec2 p){
  vec2 q = p + (fbm(vec3(p*0.00055,0.0),2)-0.5)*260.0;
  float r = ridge(q);
  /* The ground opens as the descent proceeds. From above there is a solid floor just
     under the deck, so the aerial reads as a landscape under weather; by the time the
     camera is through the deck that floor has become the chasm it descends. One field,
     one reading of it per altitude — the camera is the only viewer, so nothing tears. */
  float open  = smoothstep(0.20, 0.54, T);
  float floorY = mix(-34.0, -650.0, open);
  float cor   = smoothstep(130.0, 540.0, abs(q.x - 20.0) + (r-0.35)*320.0);
  float wall  = mix(floorY, mix(-34.0,-112.0,open), cor) + (r-0.35)*140.0*cor*open;
  float d1    = length((q-vec2(600.0,1330.0))/vec2(575.0,710.0));
  float m1    = pow(clamp(1.0-d1,0.0,1.0),1.70);
  float peak  = m1*(r*620.0 - floorY) + floorY;
  return max(peak, wall);
}
bool marchT(vec3 ro, vec3 rd, out float t, out vec3 pos){
  t = 3.0; float lt=t, ld = ro.y+rd.y*t - terrainH((ro+rd*t).xz);
  if(ld < 0.0){ pos = ro+rd*t; return true; }
  for(int i=0;i<118;i++){
    float st = max(7.0, t*0.023);
    t += st; if(t > 7600.0) break;
    vec3 p = ro+rd*t; float d = p.y - terrainH(p.xz);
    if(d < 0.0){ t = mix(lt,t, ld/(ld-d)); pos = ro+rd*t; return true; }
    ld = d; lt = t;
  }
  return false;
}
vec3 terrainN(vec2 p){ float e=3.0;
  return normalize(vec3(terrainH(p-vec2(e,0.0))-terrainH(p+vec2(e,0.0)), 2.0*e,
                        terrainH(p-vec2(0.0,e))-terrainH(p+vec2(0.0,e)))); }

float cloudD(vec3 p){
  float y = (p.y-CB)/(CT-CB);
  if(y<0.0||y>1.0) return 0.0;
  float shape = smoothstep(0.0,0.30,y)*smoothstep(1.0,0.46,y);
  float base = fbm(vec3(p.xz*0.00040,0.0),2);
  float d = (fbm(p*0.00205,4) - 0.435 + (base-0.5)*0.20) * 2.75;
  d = clamp(d,0.0,1.0);
  if(d>0.02) d = clamp(d - (1.0-d)*fbm(p*0.0098,2)*0.62, 0.0, 1.0);   /* erosion — wisps, not milk */
  return d*shape;
}
float lightMarch(vec3 p, vec3 L){
  float d=0.0, s=14.0;
  for(int i=0;i<3;i++){ p += L*s; d += cloudD(p)*s; s*=2.0; }
  return exp(-d*0.075);
}

void main(){
  vec2 uv = (gl_FragCoord.xy - 0.5*R)/R.y;
  float j = clamp(T,0.0,1.0);
  float s = smoothstep(0.04,0.96,j);
  vec3 L = normalize(vec3(0.52,0.30,0.80));

  vec3 ro = vec3(mix(-150.0, 55.0,j), mix(246.0,-420.0,s), mix(-560.0,300.0,j));
  float pitch = mix(-0.120,-0.330, smoothstep(0.14,0.86,j));
  float yaw   = mix( 0.270, 0.060, j);
  vec3 fw = normalize(vec3(sin(yaw)*cos(pitch), sin(pitch), cos(yaw)*cos(pitch)));
  vec3 rt = normalize(cross(vec3(0,1,0), fw));
  vec3 upv= cross(fw, rt);
  vec3 rd = normalize(fw*mix(1.34,1.16,j) + rt*uv.x + upv*uv.y);

  float below = clamp((CB - ro.y)/60.0, 0.0, 1.0);
  float deep  = clamp((CB - ro.y)/400.0, 0.0, 1.0);
  bool  inSlab = (ro.y>CB && ro.y<CT);

  /* ---- sky ---- */
  vec3 skyT = vec3(0.0055,0.0095,0.0245), skyH = vec3(0.026,0.038,0.072);
  vec3 col = mix(skyH, skyT, pow(clamp(rd.y*0.5+0.5,0.0,1.0),0.8));
  float md = max(dot(rd,L),0.0);
  col += LC*pow(md,10.0)*0.055 + LC*pow(md,900.0)*1.6;
  { vec3 sp = rd*430.0; vec3 sc = floor(sp);
    float st = smoothstep(0.9945,1.0,h31(sc)) * smoothstep(0.40,0.02,length(fract(sp)-0.5));
    col += vec3(0.8,0.86,1.0)*st*clamp(rd.y*2.6,0.0,1.0)*(1.0-below); }
  col = mix(col, vec3(0.010,0.030,0.058), deep);

  /* ---- terrain ---- */
  float terT = 1e9; vec3 tp; bool hit = marchT(ro, rd, terT, tp);
  float contour = 0.0;
  if(hit){
    vec3 n = terrainN(tp.xz);
    float dif = clamp(dot(n,L),0.0,1.0);
    float snow = clamp(smoothstep(30.0,175.0,tp.y)*smoothstep(0.40,0.88,n.y)*1.3, 0.0, 1.0);
    vec3 alb = mix(vec3(0.020,0.026,0.040), vec3(0.62,0.68,0.80), snow);
    alb = mix(alb, vec3(0.048,0.062,0.080), deep);
    vec3 tc = alb*(LC*dif*1.5 + vec3(0.030,0.048,0.086)*(0.5+0.5*n.y)*0.8);
    tc = mix(tc, alb*(vec3(0.18,0.42,0.70)*(0.25+0.95*clamp(n.y,0.0,1.0))
                    + vec3(0.05,0.14,0.26)), deep);   /* lit from the surface above */
    float iso = abs(fract(tp.y/28.0)-0.5)*2.0;
    contour = (1.0-smoothstep(0.0, clamp(fwidth(tp.y/28.0)*2.4,0.02,0.6), iso))
            * smoothstep(1900.0, 320.0, terT) * clamp(n.y+0.30,0.0,1.0)
            * step(fwidth(tp.y/28.0), 0.34);
    col = tc;
  }

  /* ---- the deck ---- */
  float t0=0.0, t1=0.0; bool cross_=false;
  { float a=(CT-ro.y)/rd.y, b=(CB-ro.y)/rd.y;
    if(abs(rd.y)>1e-4){
      if(inSlab){ t0=0.0; t1=min(max(a,b), min(terT,5600.0)); cross_ = t1>t0; }
      else { float lo=min(a,b), hi=max(a,b);
             if(hi>0.0){ t0=max(lo,0.0); t1=min(hi, min(terT,5600.0)); cross_ = t1>t0; } } } }
  if(cross_){
    int N = int(mix(30.0, 62.0, CQ));
    float dt = (t1-t0)/float(N);
    float trans=1.0; vec3 acc=vec3(0.0);
    float ph = 0.45 + 0.75*pow(clamp(dot(rd,L),0.0,1.0),3.5);
    for(int i=0;i<62;i++){
      if(i>=N || trans<0.010) break;
      vec3 p = ro + rd*(t0 + (float(i)+0.5)*dt);
      float d = cloudD(p);
      if(d>0.002){
        float sh = lightMarch(p, L);
        vec3 lit = LC*(0.040 + 2.35*sh*ph) + vec3(0.026,0.038,0.072)*0.85;
        lit *= inSlab ? 2.6 : 1.0;
        lit = mix(lit, vec3(0.075,0.20,0.34)*(0.30+1.15*sh), deep);   /* surface, from beneath */
        float a2 = 1.0 - exp(-d*dt*0.062);
        acc += lit*a2*trans; trans *= (1.0-a2);
      }
    }
    col = col*trans + acc;
    contour *= trans;
  }

  /* ---- medium ---- */
  float dist = hit ? terT : 4400.0;
  vec3 fogC = mix(vec3(0.030,0.042,0.078), vec3(0.0065,0.026,0.055), deep);
  float fg  = 1.0 - exp(-dist*mix(0.00030,0.00115,deep));
  col = mix(col, fogC, fg);
  col *= mix(1.0, mix(1.25, 0.42, clamp((CB-ro.y-rd.y*min(dist,900.0))/560.0,0.0,1.0)), deep);
  contour *= (1.0-fg*0.88);

  /* ---- shafts + particulate: the same moonlight, now through water ---- */
  if(deep > 0.001){
    float sh=0.0; float far=min(dist,1500.0);
    for(int i=0;i<10;i++){
      float tt=(float(i)+0.5)/10.0;
      vec3 p = ro + rd*(tt*far);
      vec2 q = (p + L*((CB-p.y)/max(L.y,0.001))).xz*0.0072;
      sh += pow(clamp(fbm(vec3(q,0.0),3)*2.6-1.05,0.0,1.0),2.4)*exp(-(CB-p.y)*0.0042);
    }
    col += vec3(0.24,0.50,0.86)*(sh/10.0)*3.4*deep*(1.0-fg*0.55);
    vec3 g = floor((ro+rd*230.0)*1.1);
    col += vec3(0.55,0.72,0.95)*smoothstep(0.9978,1.0,h31(g))*0.55*deep;
  }

  col += vec3(0.72,0.86,1.0)*contour*OV*mix(0.40,0.20,deep);

  col = 1.0 - exp(-col*1.55);
  col = pow(clamp(col,0.0,1.0), vec3(0.4545));
  col += (h31(vec3(gl_FragCoord.xy,1.0))-0.5)*0.014;
  O = vec4(col,1.0);
}
</script>

<script>
(function(){
  var P = new URLSearchParams(location.search);
  var shot = P.has('t');
  var cv = document.getElementById('c');
  var gl = cv.getContext('webgl2', {antialias:false, preserveDrawingBuffer:true});
  if(!gl){ document.getElementById('stage').innerHTML =
    '<p style="font:14px system-ui;color:#EAF0FF;padding:40px">WebGL2 is required for this proof.</p>'; return; }

  var VS = '#version 300 es\nin vec2 a; void main(){ gl_Position=vec4(a,0.,1.); }';
  function sh(t,src){ var s=gl.createShader(t); gl.shaderSource(s,src); gl.compileShader(s);
    if(!gl.getShaderParameter(s,gl.COMPILE_STATUS)) console.error(gl.getShaderInfoLog(s)); return s; }
  var pr = gl.createProgram();
  gl.attachShader(pr, sh(gl.VERTEX_SHADER, VS));
  gl.attachShader(pr, sh(gl.FRAGMENT_SHADER, document.getElementById('fs').textContent.trim()));
  gl.linkProgram(pr); gl.useProgram(pr);
  var vb = gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER, vb);
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1,3,-1,-1,3]), gl.STATIC_DRAW);
  var la = gl.getAttribLocation(pr,'a'); gl.enableVertexAttribArray(la);
  gl.vertexAttribPointer(la,2,gl.FLOAT,false,0,0);
  var uR=gl.getUniformLocation(pr,'R'), uT=gl.getUniformLocation(pr,'T'),
      uO=gl.getUniformLocation(pr,'OV'), uQ=gl.getUniformLocation(pr,'CQ');

  var W = parseInt(P.get('w')||'0'), H = parseInt(P.get('h')||'0');
  var CQ = shot ? (parseFloat(P.get('q')||'1')) : 0.45;
  /* A raymarched frame is priced per pixel, so the canvas is rendered at a fixed
     internal width and stretched by CSS. At this scale the scene is atmosphere and
     silhouette — there is no fine detail for the extra pixels to resolve. */
  var MAXW = 1180;
  function size(){
    var w, h;
    if(W){ w=W; h=H; }
    else { var ar = innerHeight/innerWidth;
           w = Math.min(MAXW, Math.round(innerWidth)); h = Math.round(w*ar); }
    if(cv.width!==w||cv.height!==h){ cv.width=w; cv.height=h; }
    gl.viewport(0,0,cv.width,cv.height);
  }
  function draw(t, ov){ size(); gl.uniform2f(uR,cv.width,cv.height);
    gl.uniform1f(uT,t); gl.uniform1f(uO,ov); gl.uniform1f(uQ,CQ);
    gl.drawArrays(gl.TRIANGLES,0,3); }

  /* ---- HUD: the H2 language reacts to the same scalar as the world ---- */
  var claim=document.getElementById('claim'), hud=document.getElementById('hud'),
      cue=document.getElementById('cue'), axis=document.getElementById('axis'),
      ralt=document.getElementById('ralt'), rdes=document.getElementById('rdes'), rtr=document.getElementById('rtr'),
      l1=document.getElementById('l1'), l2=document.getElementById('l2');
  (function ticks(){ var h='';
    for(var i=0;i<=8;i++){ var y=(i/8*100).toFixed(1);
      h += '<span style="top:'+y+'%"></span><b style="top:'+y+'%">'+(3600-i*300)+'</b>'; }
    axis.innerHTML = h; })();
  function hudUpdate(t, ov){
    var alt = Math.round(3400 - t*4200);
    ralt.textContent = (alt<0? '−'+Math.abs(alt) : ''+alt).replace(/\B(?=(\d{3})+(?!\d))/g,' ');
    rdes.textContent = String(Math.round(t*999)).padStart(3,'0');
    rtr.textContent  = String(Math.min(9,1+Math.floor(t*11))).padStart(2,'0') + ' / 09';
    hud.style.opacity   = (ov * (t<0.52 ? 1 : Math.max(0, 1-(t-0.52)/0.20))).toFixed(3);
    claim.style.opacity = Math.max(0, 1 - Math.max(0,(t-0.10))/0.16).toFixed(3);
    cue.style.opacity   = Math.max(0, 1 - t/0.05).toFixed(3);
    l1.style.opacity = (t<0.30?1:0).toFixed(0); l2.style.opacity = (t<0.34?1:0).toFixed(0);
  }

  if(shot){
    var t = parseFloat(P.get('t')), ov = parseFloat(P.get('ov')||'1');
    hud.classList.remove('fade'); claim.classList.remove('fade'); cue.classList.remove('fade');
    hudUpdate(t, ov); draw(t, ov);
    requestAnimationFrame(function(){ window.__ready = true; });
    return;
  }

  var target=0, cur=0;
  function onScroll(){ var m=document.body.scrollHeight-innerHeight;
    target = m>0 ? Math.min(1, scrollY/m) : 0; }
  addEventListener('scroll', onScroll, {passive:true}); addEventListener('resize', size); onScroll();
  var reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
  var last = -1, dirty = true;
  addEventListener('resize', function(){ dirty = true; });
  (function loop(){
    cur += (target-cur)*(reduced?1:0.12);
    if(dirty || Math.abs(cur-last) > 0.00035){        /* idle costs nothing */
      draw(cur, 1.0); hudUpdate(cur, 1.0); last = cur; dirty = false;
    }
    requestAnimationFrame(loop);
  })();
})();
</script>
</body></html>
